data:
  base_path: "data/"
  recipes_csv: "dataset_ricette.csv"
  ingredients_csv: "cleaned_ingredients.csv"

models:
  encoding: "BAAI/bge-large-en-v1.5"
  language: 
    - "hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF"
    - "hf.co/bartowski/Llama-3.2-3B-Instruct-GGUF"
    - "qwen3.5:0.8b"
    - "gemma3:1b"
    - "qwen3.5:2b"
    - "qwen3.5:4b"
    - "ministral-3:3b"
    - "granite4.1:3b"
    - "gemma3:4b"
    - "gemma3:12b"
    - "gemma4:e2b"
    - "gemma4:e4b"
    - "granite4.1:8b"
    - "ministral-3:8b"
    - "ministral-3:14b"
    - "gemma4:26b"
    - "gpt-oss:20b"


  device: "cuda"
  llm_num_ctx: 4096
  llm_num_predict: 256
  llm_think: false
  llm_temperature: 0.2
  llm_timeout: 120
  llm_retries: 3
  llm_keep_alive: "5m"

retrieval:
  nlist: 30
  nprobe: 6
  # La generation usa sempre il contesto oracle costruito dal dataset; questi
  # parametri restano disponibili per analisi separate della retrieval.
  # Imposta controlled_dataset: true per usare esattamente n_per_size elementi per ogni cardinalità
  controlled_dataset: true
  n_per_size: 100


experiments:
  - rag
  - llm_only
  - rag_vs_llm
