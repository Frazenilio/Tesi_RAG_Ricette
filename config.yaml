data:
  base_path: "data/"
  # recipes_csv: "dataset_ricette.csv"
  ## NEW: Using my dataset
  recipes_csv: "filtered_2M_dataset_V14.csv"
  # ingredients_csv: "cleaned_ingredients.csv"
  ## NEW: Using my cleaned ingredients
  ingredients_csv: "cleaned_filtered_ingredients.csv"
  ## NEW: Using my cleaned directions
  directions_csv: "cleaned_filtered_directions.csv"
  # Optional: specify a list of recipe names to test. If empty, tests all recipes in the dataset.
  filter_recipes:
    - "Carbonara"
    - "Pistachio Cake"
    - "Baked Macaroni and Cheese"
    - "Pizza"
    - "Soft Pretzels"
    - "Italian Pork Chops"

models:
  encoding: "BAAI/bge-large-en-v1.5"
  language: 
    # - "hf.co/bartowski/Llama-3.2-1B-Instruct-GGUF"
    # - "hf.co/bartowski/Llama-3.2-3B-Instruct-GGUF"
    - "qwen3.5:0.8b"
    - "gemma3:1b"
    # - "qwen3.5:2b"
    # - "qwen3.5:4b"
    # - "ministral-3:3b"
    # - "granite4.1:3b"
    # - "gemma3:4b"
    # - "gemma3:12b"
    # - "gemma4:e2b"
    # - "gemma4:e4b"
    # - "granite4.1:8b"
    # - "ministral-3:8b"
    # - "ministral-3:14b"
    # - "gemma4:26b"
    # - "gpt-oss:20b"


  # device: "cuda"
  ## NEW: I use CPU (no NVIDIA)
  device: "cpu"
  llm_num_ctx: 4096
  llm_num_predict: 256
  llm_think: false
  llm_temperature: 0.2
  llm_timeout: 120
  llm_retries: 3
  llm_keep_alive: "5m"
  # Set to true to delete pulled Ollama models from local storage after running
  delete_after_run: false

retrieval:
  nlist: 30
  nprobe: 6
  # La generation usa sempre il contesto oracle costruito dal dataset; questi
  # parametri restano disponibili per analisi separate della retrieval.
  # Imposta controlled_dataset: true per usare esattamente n_per_size elementi per ogni cardinalità
  controlled_dataset: false
  n_per_size: 100
  # Strategies to run and compare. Choices: 'mixed', 'combined', 'separated'
  strategies:
    - mixed
    - combined
    - separated


experiments:
  - rag
  - llm_only
  - rag_vs_llm
